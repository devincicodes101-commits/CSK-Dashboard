# Refreshes the dashboard every thirty minutes.
#
# WHY THIS EXISTS RATHER THAN A VERCEL CRON
#
# Vercel's Hobby plan runs cron jobs once per day and no more often. CSK are on
# Hobby. vercel.json therefore carries a daily run as the dependable floor, and
# this workflow does the frequent one — GitHub Actions has no such limit, costs
# nothing on a public repository, and calls exactly the same endpoint.
#
# If the account ever moves to Vercel Pro, delete this file and change the
# schedule in vercel.json to */30. Two schedulers hitting the same route is
# harmless but pointless.
#
# WHAT IT ACTUALLY DOES
#
# One HTTPS request. All the work happens in /api/sync, which refreshes the
# current week and the one just finished — see that route for why it leaves
# older weeks frozen.
#
# SETUP (both are repository secrets, Settings -> Secrets and variables ->
# Actions -> New repository secret):
#
#   DASHBOARD_URL   https://your-project.vercel.app
#                   Use the STABLE production domain, not a deployment URL
#                   with a hash in it — those change on every push. A missing
#                   https:// or a trailing slash is tidied up below.
#   CRON_SECRET     the same value set in Vercel's environment variables
#
# Without both, the job fails loudly rather than appearing to succeed.

name: Refresh dashboard

on:
  schedule:
    # Every thirty minutes. GitHub runs scheduled jobs on a best-effort basis
    # and can be several minutes late under load, which does not matter for a
    # weekly report.
    - cron: "*/30 * * * *"
  # So it can be run by hand from the Actions tab — useful for backfilling
  # after a reconnect without waiting for the next slot.
  workflow_dispatch:
    inputs:
      weeks:
        description: "How many recent weeks to fetch (1-26)"
        required: false
        default: "2"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call the sync endpoint
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEEKS: ${{ github.event.inputs.weeks || '2' }}
        run: |
          set -uo pipefail

          # Strip ALL whitespace from both secrets before use.
          #
          # Pasting into GitHub's secret box keeps whatever came with the
          # value, and a trailing newline is invisible in every UI that shows
          # it. In a URL it makes the host unresolvable; in an Authorization
          # header it makes the header malformed. Either way curl gives up
          # before sending anything and reports HTTP 000, which says nothing
          # about the cause. Vercel refuses such a value outright at build
          # time; GitHub does not, so it is handled here.
          base=$(printf '%s' "${DASHBOARD_URL:-}" | tr -d '[:space:]')
          secret=$(printf '%s' "${CRON_SECRET:-}" | tr -d '[:space:]')

          if [ -z "$base" ] || [ -z "$secret" ]; then
            echo "::error::DASHBOARD_URL and CRON_SECRET must both be set as repository secrets (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

          base="${base%/}"
          case "$base" in
            http://*|https://*) ;;
            *) base="https://$base" ;;
          esac

          url="${base}/api/sync?weeks=${WEEKS}"
          echo "Refreshing ${url}"
          echo "Secret length: ${#secret} characters"

          # The secret travels as a bearer header, not in the query string, so
          # it stays out of GitHub's logs and Vercel's access logs.
          status=$(curl --silent --show-error             --max-time 120             --write-out "%{http_code}"             --output response.json             --header "Authorization: Bearer ${secret}"             "$url" 2>curl-error.txt)
          curl_exit=$?

          echo "curl exit code: ${curl_exit}"
          echo "HTTP status: ${status}"

          if [ "${curl_exit}" -ne 0 ]; then
            echo "--- curl said ---"
            cat curl-error.txt || true
            echo "::error::Could not reach ${url}. Check DASHBOARD_URL is the stable production domain and that the latest Vercel deployment actually built."
            exit 1
          fi

          echo "--- response ---"
          cat response.json || true
          echo

          case "$status" in
            200)
              echo "Refresh complete."
              ;;
            401)
              echo "::error::Rejected. CRON_SECRET in GitHub does not match CRON_SECRET in Vercel, or it is not set in Vercel at all."
              exit 1
              ;;
            404)
              echo "::error::No /api/sync on that deployment. The Vercel build probably failed — check the Deployments tab."
              exit 1
              ;;
            502)
              # Surface the reason rather than the category. The route reports
              # a per-week error; without it the annotation says only that
              # something went wrong, and the person reading it has to expand
              # the step to learn anything — which is exactly when a failing
              # scheduled job gets ignored.
              reason=$(jq -r '.failed[0].error // empty' response.json 2>/dev/null || true)
              if [ -n "$reason" ]; then
                echo "::error::Reached the dashboard, but no week could be fetched. Jobber or QuickBooks said: ${reason}"
              else
                echo "::error::Reached the dashboard, but no week could be fetched. See the response above."
              fi
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP ${status}."
              exit 1
              ;;
          esac
